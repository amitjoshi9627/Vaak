[project]
name = "vaak"
version = "0.1.2"
description = "Vaak — an ear that's trained to notice."
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Vaak" }
]

dependencies = [
    "pydantic>=2.11",
    "pytest>=9.1.1",
    "pyyaml>=6.0",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio==2.11.0",
    "torchcodec==0.16.0",
    "types-pyyaml>=6.0.12.20260815",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaak"]



[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

exclude = [
    ".git",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "outputs",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "N",
    "RUF",
]

ignore = [
    "E501",
    "N812"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.mypy]
python_version = "3.12"
strict = true

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

no_implicit_optional = true
check_untyped_defs = true

show_error_codes = true
pretty = true

mypy_path = ["src"]


[[tool.mypy.overrides]]
module = [
    "torchaudio",
    "soundfile"
]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
