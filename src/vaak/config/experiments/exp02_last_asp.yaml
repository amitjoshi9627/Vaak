experiment_name: "wavlm_last_asp"

data:
  manifest: "data/manifests/asvspoof2019_la.csv"
  sample_rate: 16000
  chunk_duration_seconds: 4.0
  hop_duration_seconds: 2.0
  max_samples: 512

model:
  name: "exp02_last_asp"
  pretrained_model_name: "microsoft/wavlm-base"
  layer_strategy: "last"
  pooling_strategy: "asp"

training:
  batch_size: 16
  learning_rate: 0.0001
  epochs: 5