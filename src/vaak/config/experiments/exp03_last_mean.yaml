experiment_name: "wavlm_last_mean"

model:
  name: "wavlm-base"
  pretrained_model_name: "microsoft/wavlm-base"
  layer_strategy: "last"
  pooling_strategy: "mean"

data:
  manifest: "data/manifests/asvspoof2019_la.csv"
  sample_rate: 16000
  chunk_duration_seconds: 4.0
  hop_duration_seconds: 2.0
  max_train_samples: 1024
  max_eval_samples: 2048
  max_test_samples: 8192

training:
  batch_size: 16
  learning_rate: 0.0001
  epochs: 5
